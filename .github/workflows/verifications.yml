# Rejoué à chaque push et à chaque pull request : le code doit respecter les règles de style,
# passer les tests et se construire. Un échec s'affiche en rouge sur GitHub.
name: Vérifications

on: [push, pull_request]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
